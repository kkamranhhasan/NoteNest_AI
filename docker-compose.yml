version: '3.8'

# ============================================================
# docker-compose.yml — NoteNest AI Platform
# Secrets are injected via environment variables.
# For local dev: create a .env file (see .env.example)
# ============================================================

services:
  db:
    image: mysql:8.0
    container_name: notenest_db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-notenest}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Automatically initialize database using the schema file
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql

  chroma:
    build:
      context: .
      dockerfile: Dockerfile.chroma
    container_name: notenest_chroma
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_db
      - huggingface_cache:/root/.cache/chroma

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notenest_web
    restart: always
    ports:
      - "8080:80"
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_SERVER: db
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-notenest}
      CHROMA_API_URL: http://chroma:8000
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY is required}
      APP_URL: ${APP_URL:-http://localhost:8080}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      JINA_API_KEY: ${JINA_API_KEY:-}
      QDRANT_API_URL: ${QDRANT_API_URL:-http://localhost:6333}
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
    depends_on:
      - db
      - chroma
    volumes:
      - ./uploads:/var/www/html/uploads

volumes:
  mysql_data:
  chroma_data:
  huggingface_cache:
